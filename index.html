function spawnEvents(){
 const s=S(),name=s.name,isSun=name.includes('太陽'),isMars=name.includes('火星'),isEarth=name.includes('地球'),isMoon=name.includes('月');

function update(now,dt){if(paused)return;const s=S();eventPhase++;difficultyTier=Math.min(4,Math.floor(p.x/700));if(system===BLACK_HOLE_SYSTEM&&eventPhase%18===0)syncHUD();if(difficultyTier!==lastDifficultyTier){lastDifficultyTier=difficultyTier;syncHUD();if(difficultyTier>0){const dn=['','ふつう','むずかしい','かなり危険','激ムズ'][difficultyTier];showToast(`⚠️ ${dn}！ DANGER ${difficultyTier+1}`,1200)}}spawnEvents();updateLasers(dt);let speed=2.55+(level-1)*.025+difficultyTier*.34+Math.min(.22,companionCount*.012);if(s.event==='SUPER WIND'&&eventPhase%300>170)speed+=1.15;if(s.event==='GIANT STORM'&&eventPhase%260>170)shake=5;else shake*=.88;p.x+=speed*dt;if(now<alienRideUntil){p.vy*=.82;p.y+=((groundY()-205)-p.y)*.045*dt}else if(now<satelliteUntil){p.vy*=.88;p.y+=((groundY()-175)-p.y)*.035*dt}else{p.vy+=s.gravity*dt;p.y+=p.vy*dt}const ceiling=8;if(p.y<ceiling){p.y=ceiling;if(p.vy<0)p.vy=0;}if(s.event==='ICE WIND'&&!p.on)p.x+=Math.sin(now/180)*.55*dt;if(s.event==='GRAVITY WELL'&&!p.on){p.x+=Math.sin(now/120)*1.1*dt;p.vy+=.10*dt}if(p.y+p.h>=groundY()){p.y=groundY()-p.h;p.vy=0;p.on=true;jumps=0}else p.on=false;
